<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type Scale" subtitle="Hero → body hierarchy" viewport="700x290" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--marble-pearl);color:var(--soft-charcoal);padding:26px 30px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:14px;height:96px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.meta{margin-top:12px}
.nm{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft-charcoal)}
.hx{font-family:var(--font-body);font-size:12px;color:var(--dark-bronze);margin-top:3px}
.cap{font-family:var(--font-label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne-gold);margin-bottom:18px}
.r{display:flex;align-items:baseline;gap:18px;padding:7px 0;border-bottom:1px solid var(--hairline)}
.t{font-family:var(--font-label);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dark-bronze);width:70px;flex:none}
</style></head><body><div class="cap">Type Scale</div>
<div class="r"><span class="t">Hero</span><span style="font-family:var(--font-display);font-weight:600;font-size:46px;text-transform:uppercase">Redefined</span></div>
<div class="r"><span class="t">H2</span><span style="font-family:var(--font-display);font-weight:500;font-size:30px">A sanctuary for the few</span></div>
<div class="r"><span class="t">Lead</span><span style="font-family:var(--font-body);font-size:19px;color:var(--dark-bronze)">Personalized care</span></div>
<div class="r" style="border:0"><span class="t">Body</span><span style="font-family:var(--font-body);font-size:16px;color:var(--warm-coal)">Rituals composed with intention.</span></div></body></html>
