<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--marble-pearl);color:var(--soft-charcoal);padding:26px 30px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:14px;height:96px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.meta{margin-top:12px}
.nm{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft-charcoal)}
.hx{font-family:var(--font-body);font-size:12px;color:var(--dark-bronze);margin-top:3px}
.cap{font-family:var(--font-label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne-gold);margin-bottom:18px}
.b{display:flex;gap:16px;align-items:flex-end}
.box{background:var(--marble-light);border:1px solid var(--hairline)}
.lab{font-family:var(--font-label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dark-bronze);margin-top:8px;text-align:center}
.glass{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:var(--shadow-glass)}
</style></head><body><div class="cap">Radii · Shadow · Glass</div><div class="b">
<div><div class="box" style="width:90px;height:64px;border-radius:8px;box-shadow:var(--shadow-soft)"></div><div class="lab">8 · soft</div></div>
<div><div class="box" style="width:90px;height:64px;border-radius:16px;box-shadow:var(--shadow-lift)"></div><div class="lab">16 · lift</div></div>
<div><div class="box" style="width:90px;height:64px;border-radius:28px;box-shadow:var(--shadow-soft)"></div><div class="lab">28 · lg</div></div>
<div><div class="glass" style="width:120px;height:64px;border-radius:16px"></div><div class="lab">glass blur</div></div>
</div></body></html>
