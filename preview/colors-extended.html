<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--marble-pearl);color:var(--soft-charcoal);padding:26px 30px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:14px;height:96px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.meta{margin-top:12px}
.nm{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft-charcoal)}
.hx{font-family:var(--font-body);font-size:12px;color:var(--dark-bronze);margin-top:3px}
.cap{font-family:var(--font-label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne-gold);margin-bottom:18px}

</style></head><body><div class="cap">Extended · Official Guide</div><div class="row">
<div><div class="sw" style="background:#FBF8F4"></div><div class="meta"><div class="nm">Marble Light</div><div class="hx">#FBF8F4</div></div></div>
<div><div class="sw" style="background:#D2C0A2"></div><div class="meta"><div class="nm">Sand Deep</div><div class="hx">#D2C0A2</div></div></div>
<div><div class="sw" style="background:#5C4A35"></div><div class="meta"><div class="nm">Bronze Shadow</div><div class="hx">#5C4A35</div></div></div>
<div><div class="sw" style="background:#1A1816"></div><div class="meta"><div class="nm">Ink Greek</div><div class="hx">#1A1816</div></div></div>
</div></body></html>
