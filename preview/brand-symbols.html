<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-body)}
.cap{position:absolute;top:18px;left:22px;font-family:var(--font-label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne-gold)}</style></head>
<body style="margin:0">
<div style="display:flex;height:220px">
  <div style="flex:1;background:var(--marble-pearl);display:flex;align-items:center;justify-content:center;position:relative">
    <span class="cap">Symbol · Bronze</span>
    <img src="../assets/greek-studio-symbol-bronze.png" style="height:140px;width:auto">
  </div>
  <div style="flex:1;background:var(--soft-charcoal);display:flex;align-items:center;justify-content:center;position:relative">
    <span class="cap" style="color:var(--greek-sand)">Symbol · Gold</span>
    <img src="../assets/greek-studio-symbol-gold.png" style="height:140px;width:auto">
  </div>
</div></body></html>
