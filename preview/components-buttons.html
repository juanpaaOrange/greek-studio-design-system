<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary gold pill · ghost bronze" viewport="700x150" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--marble-pearl);color:var(--soft-charcoal);padding:26px 30px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:14px;height:96px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.meta{margin-top:12px}
.nm{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft-charcoal)}
.hx{font-family:var(--font-body);font-size:12px;color:var(--dark-bronze);margin-top:3px}
.cap{font-family:var(--font-label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne-gold);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;font-family:var(--font-label);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.p{background:var(--champagne-gold);color:var(--marble-pearl);box-shadow:0 10px 30px -12px rgba(168,132,95,.7)}
.g{background:transparent;color:var(--dark-bronze);border:1px solid var(--dark-bronze)}
</style></head><body><div class="cap">Buttons</div><div class="row" style="align-items:center">
<span class="btn p">Book Appointment</span>
<span class="btn g">Explore Experiences</span>
</div></body></html>
