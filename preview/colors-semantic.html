<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic Color Roles" subtitle="bg · fg · accent · hairline" viewport="700x300" --><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--marble-pearl);color:var(--soft-charcoal);padding:26px 30px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:14px;height:96px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.meta{margin-top:12px}
.nm{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft-charcoal)}
.hx{font-family:var(--font-body);font-size:12px;color:var(--dark-bronze);margin-top:3px}
.cap{font-family:var(--font-label);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne-gold);margin-bottom:18px}
.line{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--hairline)}
.dot{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:var(--shadow-soft)}
.role{font-family:var(--font-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;flex:1}
.val{font-family:var(--font-body);font-size:12px;color:var(--dark-bronze)}
</style></head><body><div class="cap">Semantic Roles</div>
<div class="line"><span class="dot" style="background:var(--bg)"></span><span class="role">bg</span><span class="val">Marble Pearl</span></div>
<div class="line"><span class="dot" style="background:var(--fg)"></span><span class="role">fg · text</span><span class="val">Soft Charcoal</span></div>
<div class="line"><span class="dot" style="background:var(--fg-subtle)"></span><span class="role">fg-subtle</span><span class="val">Dark Bronze</span></div>
<div class="line"><span class="dot" style="background:var(--accent)"></span><span class="role">accent</span><span class="val">Champagne Gold</span></div>
<div class="line" style="border:0"><span class="dot" style="background:var(--hairline)"></span><span class="role">hairline</span><span class="val">Light Taupe</span></div></body></html>
