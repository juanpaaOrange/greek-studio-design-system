<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greek Studio — Gift Card · Maryori Bermúdez</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold-1: #f6e7b9;
    --gold-2: #e3c470;
    --gold-3: #b08a2e;
    --gold-4: #6e5212;
    --ink: #0b0905;
    --card-w: 640px;
    --card-h: 400px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(1200px 700px at 50% 20%, #171208 0%, #0b0905 55%, #060503 100%);
    color: var(--gold-1);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    overflow: hidden;
    padding: 24px 16px;
  }

  /* ---------- Header ---------- */
  header { text-align: center; animation: fadeDown 1.4s cubic-bezier(.2,.7,.2,1) both; }

  header .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(246,231,185,.55);
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 48px);
    letter-spacing: .14em;
    background: linear-gradient(100deg, var(--gold-4) 0%, var(--gold-2) 25%, var(--gold-1) 50%, var(--gold-2) 75%, var(--gold-4) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleSheen 5s linear infinite;
  }

  @keyframes titleSheen { to { background-position: 200% center; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }

  /* ---------- Scene / card ---------- */
  .scene { perspective: 1400px; }

  .card {
    position: relative;
    width: min(var(--card-w), 92vw);
    aspect-ratio: 8 / 5;
    transform-style: preserve-3d;
    animation: cardEnter 1.8s cubic-bezier(.2,.75,.25,1) both, floatIdle 7s ease-in-out 1.8s infinite;
    will-change: transform;
    cursor: pointer;
  }

  .card.interacting { animation: cardEnter 1.8s cubic-bezier(.2,.75,.25,1) both; transition: transform .08s linear; }

  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(90px) rotateX(38deg) scale(.86); filter: blur(10px); }
    60% { filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); filter: blur(0); }
  }

  @keyframes floatIdle {
    0%, 100% { transform: rotateX(0deg) rotateY(0deg) translateY(0); }
    25% { transform: rotateX(2.2deg) rotateY(-2.4deg) translateY(-7px); }
    50% { transform: rotateX(-1.6deg) rotateY(2.2deg) translateY(-3px); }
    75% { transform: rotateX(1.4deg) rotateY(-1.2deg) translateY(-8px); }
  }

  .card::after {
    content: '';
    position: absolute;
    inset: auto 6% -16% 6%;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(176,138,46,.5), transparent 70%);
    filter: blur(18px);
    animation: glowPulse 4.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes glowPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(135deg, #2a2113 0%, #161208 28%, #0d0a05 60%, #1c150a 100%);
    box-shadow:
      0 40px 90px -20px rgba(0,0,0,.85),
      0 18px 40px -18px rgba(160,124,30,.35),
      inset 0 1px 0 rgba(246,231,185,.25),
      inset 0 -1px 0 rgba(0,0,0,.6);
  }

  /* brushed metal */
  .card-face::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(115deg, rgba(246,231,185,.05) 0 2px, transparent 2px 5px);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .frame {
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(227,196,112,.45);
    border-radius: 14px;
    pointer-events: none;
  }

  .meander { position: absolute; left: 24px; right: 24px; height: 16px; opacity: .8; }
  .meander.top { top: 22px; }
  .meander.bottom { bottom: 22px; }

  .watermark {
    position: absolute;
    right: -4%;
    bottom: -8%;
    width: 46%;
    opacity: .09;
    pointer-events: none;
  }

  /* ---------- Content ---------- */
  .content {
    position: absolute;
    inset: 0;
    padding: 52px 46px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .row-top { display: flex; justify-content: space-between; align-items: flex-start; }

  .brand .label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .5em;
    text-transform: uppercase;
    color: rgba(246,231,185,.5);
    margin-bottom: 8px;
  }

  .brand .name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: .22em;
    filter: drop-shadow(0 0 14px rgba(227,196,112,.35));
    background: linear-gradient(100deg, var(--gold-2), var(--gold-1) 40%, #fff7dd 55%, var(--gold-1) 70%, var(--gold-2));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleSheen 6s linear infinite;
  }

  .emblem { width: 58px; height: 58px; filter: drop-shadow(0 0 10px rgba(227,196,112,.35)); animation: emblemGlow 4s ease-in-out infinite; }
  @keyframes emblemGlow {
    0%,100% { filter: drop-shadow(0 0 6px rgba(227,196,112,.25)); }
    50% { filter: drop-shadow(0 0 14px rgba(227,196,112,.55)); }
  }

  .discount {
    text-align: center;
    margin: 2px 0;
  }

  .discount .value {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(44px, 9vw, 72px);
    line-height: 1;
    letter-spacing: .06em;
    background: linear-gradient(100deg, var(--gold-4) 0%, var(--gold-2) 30%, var(--gold-1) 50%, var(--gold-2) 70%, var(--gold-4) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleSheen 4.5s linear infinite, popIn 1.2s cubic-bezier(.2,.9,.3,1.3) .9s both;
  }

  .discount .caption {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .5em;
    text-transform: uppercase;
    color: rgba(246,231,185,.65);
    margin-top: 10px;
    animation: fadeDown 1s ease .5s both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(.6); filter: blur(6px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .row-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }

  .field .key {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: rgba(246,231,185,.45);
    margin-bottom: 5px;
  }

  .field .val {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: .18em;
    color: var(--gold-1);
  }

  .field.code .val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: .22em; color: var(--gold-2); }

  .field { opacity: 0; animation: fadeDown 1s ease both; }
  .field:nth-child(1) { animation-delay: 1.3s; }
  .field:nth-child(2) { animation-delay: 1.5s; }
  .field:nth-child(3) { animation-delay: 1.7s; }

  /* ---------- Sheen & glare ---------- */
  .sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 38%, rgba(246,231,185,.14) 48%, rgba(255,250,230,.28) 50%, rgba(246,231,185,.14) 52%, transparent 62%);
    transform: translateX(-120%);
    animation: sheenSweep 5.5s ease-in-out 2.2s infinite;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes sheenSweep {
    0% { transform: translateX(-120%); }
    38%, 100% { transform: translateX(120%); }
  }

  .glare {
    position: absolute;
    inset: 0;
    --gx: 50%;
    --gy: 50%;
    background: radial-gradient(320px circle at var(--gx) var(--gy), rgba(246,231,185,.14), transparent 60%);
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
    z-index: 4;
  }

  .card.interacting .glare { opacity: 1; }

  /* ---------- Particles ---------- */
  .dust { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dust span {
    position: absolute;
    bottom: -12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(246,231,185,.9), rgba(227,196,112,.25) 70%, transparent);
    animation: rise linear infinite;
    opacity: 0;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: .85; }
    85% { opacity: .4; }
    100% { transform: translateY(-105vh) translateX(28px); opacity: 0; }
  }

  footer {
    font-size: 15px;
    font-style: italic;
    color: rgba(246,231,185,.45);
    letter-spacing: .06em;
    animation: fadeDown 1.2s ease 2.2s both;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Greek Studio · Cortesía de Maryori Bermúdez</div>
    <h1>GIFT CARD</h1>
  </header>

  <div class="scene">
    <div class="card" id="card">
      <div class="card-face">

        <!-- Watermark: laurel wreath -->
        <svg class="watermark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#e3c470" stroke-width="2.5" fill="none">
            <path d="M60 170 C30 140 25 90 50 55" />
            <path d="M140 170 C170 140 175 90 150 55" />
            <g fill="#e3c470" stroke="none">
              <ellipse cx="48" cy="140" rx="14" ry="6" transform="rotate(-40 48 140)"/>
              <ellipse cx="40" cy="115" rx="14" ry="6" transform="rotate(-55 40 115)"/>
              <ellipse cx="38" cy="90" rx="14" ry="6" transform="rotate(-72 38 90)"/>
              <ellipse cx="44" cy="66" rx="14" ry="6" transform="rotate(-85 44 66)"/>
              <ellipse cx="152" cy="140" rx="14" ry="6" transform="rotate(40 152 140)"/>
              <ellipse cx="160" cy="115" rx="14" ry="6" transform="rotate(55 160 115)"/>
              <ellipse cx="162" cy="90" rx="14" ry="6" transform="rotate(72 162 90)"/>
              <ellipse cx="156" cy="66" rx="14" ry="6" transform="rotate(85 156 66)"/>
            </g>
          </g>
        </svg>

        <!-- Meander borders -->
        <svg class="meander top" preserveAspectRatio="none" viewBox="0 0 400 16" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="keyG" width="24" height="16" patternUnits="userSpaceOnUse">
              <path d="M0 14 L0 2 L20 2 L20 10 L8 10 L8 6 L14 6" stroke="#e3c470" stroke-width="1.6" fill="none"/>
            </pattern>
          </defs>
          <rect width="400" height="16" fill="url(#keyG)" />
        </svg>
        <svg class="meander bottom" preserveAspectRatio="none" viewBox="0 0 400 16" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="16" fill="url(#keyG)" />
        </svg>

        <div class="frame"></div>

        <div class="content">
          <div class="row-top">
            <div class="brand">
              <div class="label">Greek Studio</div>
              <div class="name">GIFT CARD</div>
            </div>
            <!-- Amphora emblem -->
            <svg class="emblem" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g stroke="#e3c470" stroke-width="2" fill="none" stroke-linecap="round">
                <path d="M24 10 h16" />
                <path d="M27 10 c0 5 -2 7 -5 9 c-5 4 -7 10 -7 15 c0 9 7 16 13 18 h8 c6 -2 13 -9 13 -18 c0 -5 -2 -11 -7 -15 c-3 -2 -5 -4 -5 -9" />
                <path d="M15 30 c-4 0 -7 2 -7 5 s3 5 6 4" />
                <path d="M49 30 c4 0 7 2 7 5 s-3 5 -6 4" />
                <path d="M26 52 h12 M24 56 h16" />
                <path d="M22 32 h20 M22 38 h20" stroke-width="1.4" />
              </g>
            </svg>
          </div>

          <div class="discount">
            <div class="value">10%</div>
            <div class="caption">De descuento · En cualquier servicio</div>
          </div>

          <div class="row-bottom">
            <div class="field">
              <div class="key">Referido por</div>
              <div class="val">MARYORI BERMÚDEZ</div>
            </div>
            <div class="field code">
              <div class="key">Código de referido</div>
              <div class="val">GS-MB-10</div>
            </div>
            <div class="field">
              <div class="key">Válida para</div>
              <div class="val">EL PORTADOR</div>
            </div>
          </div>
        </div>

        <div class="sheen"></div>
        <div class="glare" id="glare"></div>
      </div>
    </div>
  </div>

  <footer>Mueve el cursor sobre la tarjeta</footer>

  <div class="dust" id="dust"></div>

<script>
  const card = document.getElementById('card');
  const glare = document.getElementById('glare');
  const MAX_TILT = 12;

  card.addEventListener('pointermove', (e) => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const rx = (0.5 - py) * MAX_TILT * 2;
    const ry = (px - 0.5) * MAX_TILT * 2;
    card.classList.add('interacting');
    card.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-6px) scale(1.02)`;
    glare.style.setProperty('--gx', `${(px * 100).toFixed(1)}%`);
    glare.style.setProperty('--gy', `${(py * 100).toFixed(1)}%`);
  });

  card.addEventListener('pointerleave', () => {
    card.classList.remove('interacting');
    card.style.transform = '';
  });

  const dust = document.getElementById('dust');
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    const size = 1.5 + Math.random() * 3.5;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 9 + Math.random() * 14 + 's';
    s.style.animationDelay = Math.random() * 12 + 's';
    dust.appendChild(s);
  }
</script>
</body>
</html>
